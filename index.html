<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="이유민 TO-DO">
<title>이유민 TO-DO LIST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,"Noto Sans KR",sans-serif}
.container{max-width:560px;margin:auto;padding:25px 20px;min-height:100vh}
.top,.title-row,.date-row,.pagination,.button-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top{margin-bottom:30px}
.date,.time{font-size:22px;font-weight:900}
.title-row{margin-bottom:22px}
.greeting{font-size:16px;color:#222}
.percent{font-size:25px;font-weight:bold}
.clear{display:none;font-size:12px;font-weight:bold;text-align:right}
.progress{height:8px;background:#eee;margin-bottom:14px;overflow:hidden}
.progress-bar{height:100%;width:0;background:#000;transition:width .2s}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.3;cursor:default}
.btn{background:#000;color:#fff;border:1px solid #000;padding:9px 12px;border-radius:5px;font-size:13px}
.btn-light{background:#fff;color:#000;border:1px solid #000;padding:8px 10px;border-radius:5px;font-size:13px;white-space:nowrap}
.button-row{justify-content:flex-end;gap:8px;margin-bottom:15px;position:relative}
.menu-toggle-btn{background:#fff;color:#000;border:1px solid #000;padding:8px 12px;border-radius:5px;font-size:13px;font-weight:bold}
.more-menu{display:none;align-items:center;gap:6px;flex-wrap:wrap}
.more-menu.open{display:flex}
.date-row{margin-bottom:20px;gap:6px}
.date-row input{min-width:0;width:100%;border:1px solid #aaa;padding:9px;border-radius:4px}
.date-row button{flex-shrink:0}
.list{display:flex;flex-direction:column}
.task{border-bottom:2px solid #000;padding:12px 3px}
.task-main{display:flex;align-items:center;gap:6px;width:100%}
.task input[type=checkbox]{width:20px;height:20px;accent-color:#000;flex-shrink:0}
.task-title{min-width:50px;flex:1;border:0;outline:0;font-size:16px;background:#fff;color:#000}
.task.done .task-title{text-decoration:line-through;color:#888}
.sub-toggle-btn{flex-shrink:0;padding:5px 7px;font-size:12px}
.due{font-size:11px;border:0;border-bottom:1px solid #aaa;padding:2px 0;background:#fff;flex-shrink:0;width:105px;line-height:1.2;text-align:right}
.delete-task-btn{border:0;background:none;color:#888;font-size:18px;font-weight:bold;padding:0 2px;flex-shrink:0;line-height:1}
.delete-task-btn:hover{color:#000}
.subtasks{margin:10px 0 4px 28px;padding-left:10px;border-left:2px solid #ddd;display:none}
.subtasks.open{display:block}
.subtask{display:flex;align-items:center;gap:8px;padding:4px 0}
.subtask input[type=checkbox]{width:16px;height:16px;accent-color:#000;flex-shrink:0}
.subtask input[type=text]{min-width:0;flex:1;border:0;border-bottom:1px solid #ddd;padding:4px;background:#fff;font-size:14px}
.subtask.done input[type=text]{text-decoration:line-through;color:#888}
.delete-sub{border:0;background:#fff;color:#777;font-size:17px;padding:0 4px}
.add-sub-row{margin-top:6px;padding-top:4px}
.add-sub-btn{background:none;border:none;color:#555;font-size:13px;padding:2px 0;text-decoration:underline;cursor:pointer}
.add-row{padding:15px 0}
.add-btn{width:100%;padding:13px;background:#fff;border:2px dashed #aaa;border-radius:5px;font-weight:bold}
.pagination{justify-content:center;padding:5px 0 20px}
.page-info{font-weight:bold;font-size:14px}
.message{border-top:5px solid #000;padding-top:20px;text-align:center;font-size:17px;font-weight:900;line-height:1.5;overflow-wrap:anywhere}
.note{font-size:12px;color:#666;line-height:1.6;margin-top:15px}
.file-input{display:none}
@media(max-width:480px){
.container{padding:20px 12px}
.date,.time{font-size:18px}
.greeting{font-size:14px}
.task-main{gap:4px}
.task-title{font-size:15px;min-width:40px}
.sub-toggle-btn{padding:4px 5px;font-size:11px}
.due{font-size:10px;width:90px}
.delete-task-btn{font-size:16px}
}

/* Firebase 로그인 및 동기화 상태 */
.auth-screen{position:fixed;inset:0;background:#fff;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:360px;border:2px solid #000;padding:25px;border-radius:8px}
.auth-card h2{margin:0 0 8px;font-size:22px}
.auth-card p{font-size:13px;line-height:1.6;color:#555}
.auth-card input{width:100%;padding:12px;margin:6px 0;border:1px solid #aaa;border-radius:5px;font-size:15px}
.auth-actions{display:flex;gap:8px;margin-top:10px}.auth-actions button{flex:1}
.auth-error{color:#b00020;font-size:12px;min-height:18px;overflow-wrap:anywhere}
.sync-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#555;margin-bottom:12px}
.sync-bar button{background:#fff;border:1px solid #aaa;border-radius:4px;padding:4px 7px;font-size:11px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h2>TO-DO LIST</h2>
    <p>윈도우와 아이폰에서 같은 계정으로 로그인하면 할 일이 자동 동기화됩니다.</p>
    <input id="authEmail" type="email" placeholder="이메일" autocomplete="username">
    <input id="authPassword" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div class="auth-actions">
      <button class="btn" id="loginBtn" type="button">로그인</button>
      <button class="btn-light" id="registerBtn" type="button" style="display:none">처음 가입</button>
    </div>
    <p id="authError" class="auth-error" role="alert"></p>
    <p>Firebase 설정이 완료된 후 사용할 수 있습니다.</p>
  </div>
</div>
<div class="container" id="appContainer">
  <div class="sync-bar"><span id="syncStatus">● 로그인 대기</span><span><button id="importLocalBtn" type="button" hidden>이 기기의 기존 일정 가져오기</button> <button id="logoutBtn" type="button">로그아웃</button></span></div>
  <div class="top">
    <div class="date" id="dateText"></div>
    <div class="time" id="timeText"></div>
  </div>

  <div class="title-row">
    <div class="greeting">이유민님 오늘 하루도 파이팅입니다.</div>
    <div style="text-align:right">
      <div class="clear" id="clear">Clear!</div>
      <div class="percent" id="percent">0%</div>
    </div>
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="button-row">
    <div class="more-menu" id="moreMenu">
      <button class="btn-light" onclick="enableNotifications()">알림 허용</button>
      <button class="btn-light" onclick="exportBackup()">백업 저장</button>
      <button class="btn-light" onclick="document.getElementById('backupFile').click()">백업 복구</button>
    </div>
    <button class="menu-toggle-btn" onclick="toggleMoreMenu()">•••</button>
    <button class="btn" onclick="resetDay()">Reset</button>
    <input class="file-input" id="backupFile" type="file" accept=".json,application/json">
  </div>

  <div class="date-row">
    <button class="btn-light" onclick="moveDate(-1)">←</button>
    <input id="selectedDate" type="date" aria-label="일정 날짜">
    <button class="btn-light" onclick="moveDate(1)">→</button>
    <button class="btn-light" onclick="goToday()">오늘</button>
  </div>

  <div class="list" id="list"></div>

  <div class="add-row">
    <button class="add-btn" onclick="addTask()">＋ 항목 추가</button>
  </div>

  <div class="pagination" id="pagination">
    <button class="btn-light" id="prevBtn" onclick="changePage(-1)">← 이전</button>
    <span class="page-info" id="pageInfo">1 / 1</span>
    <button class="btn-light" id="nextBtn" onclick="changePage(1)">다음 →</button>
  </div>

  <div class="message" id="message"></div>
  <div class="note">
    일정은 Firebase 클라우드에 자동 저장되고 로그인한 기기 간 동기화됩니다. 백업 파일도 정기적으로 저장해 주세요.
    알림은 웹앱이 열려 있는 동안 확인됩니다.
  </div>
</div>

<script>
const STORAGE_KEY="yumin_todo_list_v4";
const OLD_KEY="yumin_todo_list_v3";
const PAGE_SIZE=5;

let db={version:4,days:{}};
let currentDate=localDate(new Date());
let currentPage=1;
let openSubtasks=new Set();

const messages=[
"오늘 한 일이 내일의 나를 만든다.",
"자존감은 내가 한 약속을 지키는 것에서 온다.",
"계속하면 결국 원하는 곳에 도착한다.",
"오늘 할 일을 내일 할 일이 아니다.",
"미래의 나에게 가장 좋은 선물은 오늘의 실행이다.",
"그냥 해라.",
"이제는 천천히 가면 큰일 난다.",
"뭐가 제일 우선인지 잊지 마라.",
"너 졸업할 거냐?",
"지금의 한 걸음이 원하는 미래와 가장 가깝다.",
"어설프게 공부하고 나에게 취하지 말자.",
"원래 공부=멘헤라는 항등식이다."
];

function toggleMoreMenu(){
  const menu=document.getElementById("moreMenu");
  menu.classList.toggle("open");
}

function localDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function makeTask(task={}){
  return {
    id:task.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8)),
    text:typeof task.text==="string"?task.text:"",
    done:Boolean(task.done),
    due:typeof task.due==="string"?task.due:"",
    notified:Boolean(task.notified),
    subtasks:Array.isArray(task.subtasks)?task.subtasks.map(s=>({
      id:s.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
      text:typeof s.text==="string"?s.text:"",
      done:Boolean(s.done)
    })):[]
  };
}

function getTasks(){
  if(!Array.isArray(db.days[currentDate]))db.days[currentDate]=[];
  return db.days[currentDate];
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  }catch(e){
    alert("저장 공간이 부족할 수 있어요. 백업 파일을 저장해 주세요.");
  }
  updateProgress();
  if(window.cloudSave) window.cloudSave();
}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(saved&&saved.days&&typeof saved.days==="object"){
      db=saved;
    }else{
      const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");
      const tasks=Array.isArray(old)?old:[];
      db={version:4,days:{}};
      db.days[currentDate]=tasks.map(t=>makeTask(typeof t==="string"?{text:t}:t));
      if(!db.days[currentDate].length){
        db.days[currentDate]=Array.from({length:PAGE_SIZE},()=>makeTask());
      }
      persist();
    }
  }catch(e){
    db={version:4,days:{}};
    db.days[currentDate]=Array.from({length:PAGE_SIZE},()=>makeTask());
  }

  if(!db.days[currentDate]||!db.days[currentDate].length){
    db.days[currentDate]=Array.from({length:PAGE_SIZE},()=>makeTask());
  }
  document.getElementById("selectedDate").value=currentDate;
  render();
}

function updateClock(){
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];
  document.getElementById("dateText").textContent=
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  document.getElementById("timeText").textContent=
    d.toLocaleTimeString("ko-KR",{hour12:false});
}

function updateMessage(){
  const start=new Date(2026,0,1);
  const today=new Date();
  const day=Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate())-start)/86400000);
  const i=((day%messages.length)+messages.length)%messages.length;
  document.getElementById("message").textContent="“"+messages[i]+"”";
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  const tasks=getTasks();
  const totalPages=Math.max(1,Math.ceil(tasks.length/PAGE_SIZE));
  currentPage=Math.min(currentPage,totalPages);
  const start=(currentPage-1)*PAGE_SIZE;

  tasks.slice(start,start+PAGE_SIZE).forEach((task,index)=>{
    renderTask(task,start+index,list);
  });

  document.getElementById("pageInfo").textContent=`${currentPage} / ${totalPages}`;
  document.getElementById("prevBtn").disabled=currentPage<=1;
  document.getElementById("nextBtn").disabled=currentPage>=totalPages;
  document.getElementById("pagination").style.display=totalPages>1?"flex":"none";
  updateProgress();
}

function addSubtask(task, focusNew=true){
  const newSub={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    text:"",
    done:false
  };
  task.subtasks.push(newSub);
  task.done=false;
  openSubtasks.add(task.id);
  persist();
  render();

  if(focusNew){
    setTimeout(()=>{
      const newInput=[...document.querySelectorAll(".subtask input[type=text]")]
        .find(input=>input.dataset.subtaskId===newSub.id);
      if(newInput) newInput.focus();
    },20);
  }
}

function renderTask(task,index,list){
  const row=document.createElement("div");
  row.className="task"+(task.done?" done":"");

  const main=document.createElement("div");
  main.className="task-main";

  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=task.done;
  check.setAttribute("aria-label","할 일 완료");

  const title=document.createElement("input");
  title.type="text";
  title.className="task-title";
  title.placeholder=`할 일 ${index+1}`;
  title.value=task.text;

  check.addEventListener("change",()=>{
    const writtenSubtasks=task.subtasks.filter(s=>s.text.trim()!=="");
    if(check.checked&&writtenSubtasks.some(s=>!s.done)){
      alert("세부 할 일을 모두 완료해야 상위 할 일을 완료할 수 있어요.");
      check.checked=false;
      task.done=false;
    }else{
      task.done=check.checked;
    }
    row.classList.toggle("done",task.done);
    persist();
  });

  title.addEventListener("input",()=>{
    task.text=title.value;
    persist();
  });

  const subBtn=document.createElement("button");
  subBtn.className="btn-light sub-toggle-btn";
  subBtn.textContent=task.subtasks.length>0?`＋ 세부 할 일 (${task.subtasks.length})`:`＋ 세부 할 일`;
  
  subBtn.addEventListener("click",()=>{
    if(openSubtasks.has(task.id)){
      if(task.subtasks.length===0){
        addSubtask(task, true);
      }else{
        openSubtasks.delete(task.id);
        render();
      }
    }else{
      openSubtasks.add(task.id);
      if(task.subtasks.length===0){
        addSubtask(task, true);
      }else{
        render();
      }
    }
  });

  const due=document.createElement("input");
  due.type="datetime-local";
  due.className="due";
  due.value=task.due;
  due.title="마감 날짜와 시간";
  due.addEventListener("change",()=>{
    task.due=due.value;
    task.notified=false;
    persist();
  });

  const delTaskBtn=document.createElement("button");
  delTaskBtn.className="delete-task-btn";
  delTaskBtn.textContent="−";
  delTaskBtn.title="항목 삭제";
  delTaskBtn.addEventListener("click",()=>{
    if(confirm("이 할 일 항목을 삭제할까요?")){
      db.days[currentDate]=getTasks().filter(t=>t.id!==task.id);
      openSubtasks.delete(task.id);
      persist();
      render();
    }
  });

  main.append(check,title,subBtn,due,delTaskBtn);
  row.append(main);

  const subList=document.createElement("div");
  subList.className="subtasks"+(openSubtasks.has(task.id)?" open":"");

  task.subtasks.forEach(sub=>{
    const subRow=document.createElement("div");
    subRow.className="subtask"+(sub.done?" done":"");

    const subCheck=document.createElement("input");
    subCheck.type="checkbox";
    subCheck.checked=sub.done;

    const subText=document.createElement("input");
    subText.type="text";
    subText.placeholder="세부 할 일 입력";
    subText.value=sub.text;
    subText.dataset.subtaskId=sub.id;

    subText.addEventListener("keydown",e=>{
      if(e.key!=="Enter") return;
      e.preventDefault();
      addSubtask(task, true);
    });

    subCheck.addEventListener("change",()=>{
      sub.done=subCheck.checked;
      subRow.classList.toggle("done",sub.done);

      const writtenSubtasks=task.subtasks.filter(s=>s.text.trim()!=="");
      if(writtenSubtasks.some(s=>!s.done)){
        task.done=false;
        check.checked=false;
        row.classList.remove("done");
      }
      persist();
    });

    subText.addEventListener("input",()=>{
      sub.text=subText.value;
      task.done=false;
      check.checked=false;
      row.classList.remove("done");
      persist();
    });

    const del=document.createElement("button");
    del.className="delete-sub";
    del.textContent="×";
    del.title="세부 할 일 삭제";
    del.addEventListener("click",()=>{
      if(confirm("이 세부 할 일을 삭제할까요?")){
        task.subtasks=task.subtasks.filter(s=>s.id!==sub.id);
        persist();
        render();
      }
    });

    subRow.append(subCheck,subText,del);
    subList.append(subRow);
  });

  const addSubRow=document.createElement("div");
  addSubRow.className="add-sub-row";
  const addSubBtnLink=document.createElement("button");
  addSubBtnLink.className="add-sub-btn";
  addSubBtnLink.textContent="＋ 세부 항목 추가";
  addSubBtnLink.addEventListener("click",()=>{
    addSubtask(task, true);
  });
  addSubRow.append(addSubBtnLink);
  subList.append(addSubRow);

  row.append(subList);
  list.append(row);
}

function addTask(){
  const tasks=getTasks();
  const newTask=makeTask();
  tasks.push(newTask);
  currentPage=Math.ceil(tasks.length/PAGE_SIZE);
  persist();
  render();
  const inputs=document.querySelectorAll(".task-title");
  if(inputs.length)inputs[inputs.length-1].focus();
}

function changePage(n){
  const total=Math.max(1,Math.ceil(getTasks().length/PAGE_SIZE));
  currentPage=Math.max(1,Math.min(total,currentPage+n));
  render();
}

function isTaskComplete(task){
  const writtenSubtasks=task.subtasks.filter(s=>s.text.trim()!=="");
  return task.done&&writtenSubtasks.every(s=>s.done);
}

function updateProgress(){
  const writtenTasks=getTasks().filter(t=>t.text.trim()!=="");
  const completed=writtenTasks.filter(isTaskComplete).length;
  const percent=writtenTasks.length?Math.round(completed/writtenTasks.length*100):0;

  document.getElementById("percent").textContent=percent+"%";
  document.getElementById("progressBar").style.width=percent+"%";
  document.getElementById("clear").style.display=
    writtenTasks.length>0&&percent===100?"block":"none";
}

function moveDate(n){
  const d=new Date(currentDate+"T12:00:00");
  d.setDate(d.getDate()+n);
  setDate(localDate(d));
}

function goToday(){
  setDate(localDate(new Date()));
}

function setDate(date){
  if(!date)return;
  currentDate=date;
  currentPage=1;
  openSubtasks.clear();
  if(!db.days[currentDate])db.days[currentDate]=[];
  document.getElementById("selectedDate").value=currentDate;
  render();
}

document.getElementById("selectedDate").addEventListener("change",e=>{
  setDate(e.target.value);
});

function resetDay(){
  if(confirm("선택한 날짜의 모든 할 일을 초기화할까요?")){
    db.days[currentDate]=Array.from({length:PAGE_SIZE},()=>makeTask());
    currentPage=1;
    openSubtasks.clear();
    persist();
    render();
  }
}

async function enableNotifications(){
  if(!("Notification" in window)){
    alert("이 브라우저에서는 알림을 지원하지 않아요.");
    return;
  }
  try{
    const permission=await Notification.requestPermission();
    alert(permission==="granted"
      ?"알림이 허용됐어요. 웹앱이 열려 있을 때 마감 시간을 확인합니다."
      :"알림이 허용되지 않았어요. 브라우저 설정을 확인해 주세요.");
  }catch(e){
    alert("알림 권한을 설정할 수 없어요. HTTPS 주소에서 열어 주세요.");
  }
}

function checkDeadlines(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  const now=Date.now();
  let changed=false;

  Object.entries(db.days).forEach(([date,tasks])=>{
    tasks.forEach(task=>{
      if(task.done||!task.due||task.notified)return;
      const dueTime=new Date(task.due).getTime();
      if(Number.isFinite(dueTime)&&dueTime<=now){
        try{
          new Notification("할 일 마감 알림",{
            body:`${task.text||"할 일"} (${date})`,
            tag:"todo-"+task.id
          });
          task.notified=true;
          changed=true;
        }catch(e){}
      }
    });
  });

  if(changed){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){}
  }
}

function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`yumin-todo-backup-${localDate(new Date())}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    alert("백업 파일을 만들지 못했어요.");
  }
}

document.getElementById("backupFile").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;

  try{
    const imported=JSON.parse(await file.text());
    if(!imported||!imported.days||typeof imported.days!=="object"||Array.isArray(imported.days)){
      throw new Error("잘못된 백업 형식");
    }

    if(!confirm("현재 데이터를 백업 파일의 데이터로 교체할까요? 먼저 현재 데이터를 백업하는 것을 권장해요.")){
      e.target.value="";
      return;
    }

    const newDays={};
    Object.entries(imported.days).forEach(([date,tasks])=>{
      if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&Array.isArray(tasks)){
        newDays[date]=tasks.map(makeTask);
      }
    });

    db={version:4,days:newDays};
    if(!db.days[currentDate])db.days[currentDate]=[];
    currentPage=1;
    openSubtasks.clear();
    persist();
    render();
    alert("백업 데이터를 복구했어요. 클라우드에도 저장됩니다.");
  }catch(err){
    alert("백업 파일을 읽지 못했어요. 올바른 JSON 파일인지 확인해 주세요.");
  }
  e.target.value="";
});

updateClock();
setInterval(updateClock,1000);
load();
updateMessage();
checkDeadlines();
setInterval(checkDeadlines,15000);
</script>

<script type="module">
// Firebase 웹앱 설정 (to-do-list-c4730)
const firebaseConfig = {
  apiKey: "AIzaSyBnFbg8DQS4MOc6Px-SJfqG0XBYzmczgJg",
  authDomain: "to-do-list-c4730.firebaseapp.com",
  databaseURL: "https://to-do-list-c4730-default-rtdb.firebaseio.com",
  projectId: "to-do-list-c4730",
  storageBucket: "to-do-list-c4730.firebasestorage.app",
  messagingSenderId: "678451446941",
  appId: "1:678451446941:web:420f2c161e0f4d7438c074"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const authScreen=document.getElementById("authScreen");
const authError=document.getElementById("authError");
const syncStatus=document.getElementById("syncStatus");
const importLocalBtn=document.getElementById("importLocalBtn");
const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");
const emailInput=document.getElementById("authEmail");
const passwordInput=document.getElementById("authPassword");
let auth,store,unsubscribe=null,writeTimer=null,activeUid=null,ready=false,dirty=false,writeQueue=Promise.resolve();
const localBeforeLogin=JSON.parse(JSON.stringify(db));
const hasWrittenTasks=(data)=>Object.values(data?.days||{}).some(tasks=>Array.isArray(tasks)&&tasks.some(t=>t.text?.trim()||t.subtasks?.some(x=>x.text?.trim())));
function status(message){syncStatus.textContent=message;}
function errorText(e){
  const code=e?.code||"";
  const map={"auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않습니다.","auth/email-already-in-use":"이미 가입된 이메일입니다. 로그인하세요.","auth/weak-password":"비밀번호를 6자 이상 입력하세요.","auth/invalid-email":"올바른 이메일을 입력하세요.","auth/operation-not-allowed":"Firebase에서 이메일/비밀번호 로그인을 활성화하세요.","permission-denied":"Firestore 보안 규칙을 확인하세요."};
  return map[code]||map[code.replace("firestore/","")]||"오류가 발생했습니다: "+(e?.message||code);
}
function queueSave(){
  if(!ready||!activeUid)return;
  dirty=true;
  status("● 저장 중…");
  clearTimeout(writeTimer);
  writeTimer=setTimeout(flushSave,550);
}
async function flushSave(){
  if(!ready||!activeUid||!dirty)return;
  dirty=false;
  const uid=activeUid;
  const payload=JSON.parse(JSON.stringify(db));
  writeQueue=writeQueue.catch(()=>{}).then(async()=>{
    if(uid!==activeUid)return;
    await setDoc(doc(store,"users",uid,"todo","main"),{data:payload,updatedAt:serverTimestamp()});
  });
  try{await writeQueue;if(uid===activeUid&&!dirty)status("● 클라우드 저장 완료");}
  catch(e){if(uid===activeUid){dirty=true;status("● 저장 실패 — 인터넷 연결 확인");console.error(e);}}
}
function applyRemote(data){
  if(!data||!data.days||typeof data.days!=="object")return;
  db={version:4,days:data.days};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){}
  render();
}
async function startSession(user){
  activeUid=user.uid;
  ready=false;dirty=false;window.cloudSave=null;
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  clearTimeout(writeTimer);
  authScreen.hidden=true;
  status("● 클라우드 연결 중…");
  const ref=doc(store,"users",user.uid,"todo","main");
  try{
    const snap=await getDoc(ref);
    if(activeUid!==user.uid)return;
    if(snap.exists()){
      applyRemote(snap.data().data);
      importLocalBtn.hidden=!hasWrittenTasks(localBeforeLogin);
    }else{
      // 첫 로그인: 현재 기기에 기존 일정이 있으면 초기 클라우드 데이터로 이전
      const initial=hasWrittenTasks(localBeforeLogin)?localBeforeLogin:{version:4,days:{}};
      applyRemote(initial);
      await setDoc(ref,{data:initial,updatedAt:serverTimestamp()});
      importLocalBtn.hidden=true;
    }
    if(activeUid!==user.uid)return;
    ready=true;
    window.cloudSave=queueSave;
    unsubscribe=onSnapshot(ref,snapshot=>{
      if(!snapshot.exists()||snapshot.metadata.hasPendingWrites||dirty)return;
      applyRemote(snapshot.data().data);
      status("● 실시간 동기화 연결됨");
    },e=>{status("● 동기화 오류");console.error(e);});
    status("● 실시간 동기화 연결됨");
  }catch(e){status("● 연결 실패");authError.textContent=errorText(e);authScreen.hidden=false;console.error(e);}
}
function stopSession(){
  clearTimeout(writeTimer);
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  ready=false;dirty=false;activeUid=null;window.cloudSave=null;
  db={version:4,days:{}};
  render();
  authScreen.hidden=false;
  importLocalBtn.hidden=true;
  status("● 로그인 대기");
}
async function authAction(register){
  authError.textContent="";
  const email=emailInput.value.trim();const password=passwordInput.value;
  if(!email||!password){authError.textContent="이메일과 비밀번호를 입력하세요.";return;}
  loginBtn.disabled=registerBtn.disabled=true;
  try{
    if(register)await createUserWithEmailAndPassword(auth,email,password);
    else await signInWithEmailAndPassword(auth,email,password);
  }catch(e){authError.textContent=errorText(e);}
  finally{loginBtn.disabled=registerBtn.disabled=false;}
}
loginBtn.addEventListener("click",()=>authAction(false));
registerBtn.addEventListener("click",()=>authAction(true));
passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")authAction(false);});
document.getElementById("logoutBtn").addEventListener("click",async()=>{
  if(dirty)await flushSave();
  try{await signOut(auth);}catch(e){alert(errorText(e));}
});
importLocalBtn.addEventListener("click",()=>{
  if(!confirm("이 기기에 원래 저장되어 있던 일정으로 클라우드 일정을 덮어쓸까요? 다른 기기의 일정이 교체됩니다."))return;
  applyRemote(localBeforeLogin);
  queueSave();
  importLocalBtn.hidden=true;
});
try{
  if(firebaseConfig.apiKey==="YOUR_API_KEY")throw new Error("HTML 파일의 firebaseConfig를 Firebase 프로젝트 설정값으로 바꿔 주세요.");
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);store=getFirestore(app);
  await setPersistence(auth,browserLocalPersistence);
  onAuthStateChanged(auth,user=>{if(user)startSession(user);else stopSession();});
}catch(e){authError.textContent=e.message;console.error(e);}
</script>
